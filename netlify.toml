[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Expo EXPO_PUBLIC_* variables (Firebase public client SDK config & public menu URL)
  # are intentionally embedded into the client web bundle and are NOT private server secrets.
  SECRETS_SCAN_OMIT_KEYS = "EXPO_PUBLIC_FEEDBACK_ONLINE_URL,EXPO_PUBLIC_FIREBASE_API_KEY,EXPO_PUBLIC_FIREBASE_APP_ID,EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN,EXPO_PUBLIC_FIREBASE_DATABASE_URL,EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID,EXPO_PUBLIC_FIREBASE_PROJECT_ID,EXPO_PUBLIC_FIREBASE_STORAGE_BUCKET"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
